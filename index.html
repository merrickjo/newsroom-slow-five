<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Newsroom Slow Five</title>
<meta name="description" content="Five slow-journalism long reads, digested twice a week.">
<meta name="theme-color" content="#fbfbf9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e0e0d" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Slow Five">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&family=Literata:opsz,wght@7..72,500;7..72,700&display=swap">
<style>
:root{
  padding-top:env(safe-area-inset-top,0px);
  --paper:#fbfbf9; --ink:#111110; --ink-2:#3b3b38; --mute:#6a6a66; --rule:#111110; --hair:#cfcfca;
  --chip-bg:#111110; --chip-fg:#fbfbf9; --nav-bg:#fbfbf9;
  --fs:18px;
  --serif:"Literata",Georgia,"Times New Roman",serif;
  --sans:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,sans-serif;
  --cond:"IBM Plex Sans Condensed","IBM Plex Sans","Arial Narrow",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0e0e0d; --ink:#f1f1ec; --ink-2:#cfcfca; --mute:#9a9a94; --rule:#f1f1ec; --hair:#3a3a37;
    --chip-bg:#f1f1ec; --chip-fg:#0e0e0d; --nav-bg:#0e0e0d; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0e0e0d; --ink:#f1f1ec; --ink-2:#cfcfca; --mute:#9a9a94; --rule:#f1f1ec; --hair:#3a3a37;
  --chip-bg:#f1f1ec; --chip-fg:#0e0e0d; --nav-bg:#0e0e0d; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:var(--fs);line-height:1.6;margin:0}
.wrap{max-width:40rem;margin:0 auto;padding-inline:18px;padding-block:20px 132px}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important}}

/* masthead */
.mast{display:flex;flex-direction:column;gap:6px;border-bottom:3px solid var(--rule);padding-bottom:14px}
.mast-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-family:var(--mono);font-size:.68em;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.brand{font-family:var(--serif);font-weight:700;font-size:2.6em;line-height:1;letter-spacing:-.02em;margin:0}
.brand span{font-weight:500;font-style:normal}
.dateline{display:flex;flex-wrap:wrap;gap:4px 14px;font-family:var(--cond);font-weight:600;font-size:.82em;letter-spacing:.04em;text-transform:uppercase}
.intro{font-family:var(--serif);font-size:1.05em;line-height:1.55;margin:18px 0 6px;color:var(--ink-2)}
.meta-line{font-family:var(--mono);font-size:.68em;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:0 0 8px}

/* story list */
.list{list-style:none;margin:8px 0 0;padding:0}
.item{border-bottom:1px solid var(--hair)}
.item button{display:grid;grid-template-columns:2.2rem 1fr;gap:4px 12px;width:100%;text-align:left;padding:18px 0}
.num{font-family:var(--serif);font-weight:700;font-size:1.9em;line-height:1;grid-row:span 3}
.cat{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:.66em;letter-spacing:.1em;text-transform:uppercase}
.tag{background:var(--chip-bg);color:var(--chip-fg);padding:2px 7px 1px;font-weight:600}
.tag.theo{background:transparent;color:var(--ink);outline:1.5px solid var(--ink);outline-offset:-1.5px}
.read-mark{color:var(--mute)}
.item h3{font-family:var(--serif);font-weight:700;font-size:1.28em;line-height:1.22;margin:2px 0 0;text-wrap:balance}
.item .dek{font-size:.9em;line-height:1.5;color:var(--ink-2);margin:0}
.item.is-read h3{color:var(--ink-2)}

/* reader */
.back{font-family:var(--mono);font-size:.7em;letter-spacing:.08em;text-transform:uppercase;text-decoration:underline;text-underline-offset:3px}
.art-head{display:flex;flex-direction:column;gap:10px;border-bottom:3px solid var(--rule);padding-block:16px 16px}
.art-head h1{font-family:var(--serif);font-weight:700;font-size:2em;line-height:1.14;letter-spacing:-.01em;margin:0;text-wrap:balance}
.art-head .dek{font-family:var(--serif);font-size:1.08em;line-height:1.5;color:var(--ink-2);margin:0}
.byline{font-family:var(--cond);font-weight:500;font-size:.82em;letter-spacing:.02em;color:var(--ink-2)}
.body p{margin:0 0 1.05em;hyphens:auto}
.body{padding-top:18px}
.body p:first-child::first-letter{font-family:var(--serif);font-weight:700;float:left;font-size:3.3em;line-height:.9;padding:4px 8px 0 0}
.box{border-top:1.5px solid var(--rule);padding-top:10px;margin-top:22px}
.box h4{font-family:var(--mono);font-size:.68em;letter-spacing:.12em;text-transform:uppercase;margin:0 0 6px}
.box p{margin:0}
.box.why{border:2px solid var(--rule);padding:14px 16px}
.src{margin-top:26px;display:flex;flex-direction:column;gap:8px;border-top:3px solid var(--rule);padding-top:12px}
.src .t{font-family:var(--serif);font-weight:700;font-size:1.05em;line-height:1.3}
.src .m{font-family:var(--mono);font-size:.7em;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)}
.cta{display:inline-flex;align-self:flex-start;align-items:center;gap:8px;border:2px solid var(--ink);padding:10px 16px;font-family:var(--cond);font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:.82em;text-decoration:none;min-height:48px}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:28px;font-family:var(--cond);font-weight:600;font-size:.85em;text-transform:uppercase;letter-spacing:.05em}
.pager button{border-bottom:2px solid var(--ink);padding:8px 0;min-height:44px}
.pager button[disabled]{opacity:.35;cursor:default}

/* archive + about */
.sec-title{font-family:var(--serif);font-weight:700;font-size:1.8em;margin:6px 0 4px}
.arch{list-style:none;margin:12px 0 0;padding:0}
.arch li{border-bottom:1px solid var(--hair)}
.arch button{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;padding:14px 0}
.arch .d{font-family:var(--mono);font-size:.7em;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.arch .h{font-family:var(--serif);font-weight:700;font-size:1.08em;line-height:1.3}
.about p{margin:0 0 1em}
.about h3{font-family:var(--mono);font-size:.7em;letter-spacing:.12em;text-transform:uppercase;margin:24px 0 8px;border-top:1.5px solid var(--rule);padding-top:10px}
.mix{width:100%;border-collapse:collapse;font-size:.88em}
.mix td{padding:8px 0;border-bottom:1px solid var(--hair);vertical-align:top}
.mix td:last-child{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:12px}
.srcs{margin:0;padding-left:1.1em}
.srcs li{margin-bottom:4px}
.settings{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.settings button{border:2px solid var(--ink);padding:8px 14px;min-height:44px;font-family:var(--cond);font-weight:600;font-size:.85em;text-transform:uppercase;letter-spacing:.05em}
.settings button[aria-pressed="true"]{background:var(--chip-bg);color:var(--chip-fg)}
.note{font-family:var(--mono);font-size:.7em;letter-spacing:.04em;color:var(--mute);margin-top:16px}
.empty{padding:40px 0;font-family:var(--serif);font-size:1.1em;color:var(--ink-2)}

/* floating bottom nav */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom, 0px));display:flex;gap:4px;background:var(--nav-bg);border:2px solid var(--ink);border-radius:999px;padding:5px;z-index:10;max-width:calc(100% - 32px)}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:76px;min-height:50px;padding:4px 14px;border-radius:999px;font-family:var(--cond);font-weight:600;font-size:.72em;letter-spacing:.07em;text-transform:uppercase}
.nav button svg{width:20px;height:20px;margin-bottom:2px;stroke:currentColor;fill:none;stroke-width:1.8}
.nav button[aria-current="page"]{background:var(--chip-bg);color:var(--chip-fg)}
@media (max-width:380px){.nav button{min-width:64px;padding:4px 8px}}
</style>

</head>
<body>
<div class="wrap" id="app" aria-live="polite">
  <div class="empty">Loading this week's edition…</div>
</div>

<nav class="nav" aria-label="Sections">
  <button id="nav-today" data-view="today" aria-current="page">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>Edition</button>
  <button id="nav-archive" data-view="archive">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="5"/><path d="M5 9v11h14V9M10 13h4"/></svg>Archive</button>
  <button id="nav-about" data-view="about">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>About</button>
</nav>

<script>
(function(){
  const app = document.getElementById('app');
  const CACHE_KEY = 'slowfive.editions.v1', READ_KEY = 'slowfive.read.v1', PREF_KEY = 'slowfive.prefs.v1';
  const store = {
    get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
    set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
  };
  let editions = store.get(CACHE_KEY, []);   // newest first
  let readSet = new Set(store.get(READ_KEY, []));
  let prefs = store.get(PREF_KEY, {size:18});
  let state = {view:'today', ed:null, story:null};
  let dbStatus = 'loading';

  document.documentElement.style.setProperty('--fs', prefs.size + 'px');

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmtDate = iso => {
    const [y,m,d] = String(iso).split('-').map(Number);
    if(!d) return iso;
    return new Date(Date.UTC(y,m-1,d)).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric',timeZone:'UTC'});
  };
  const fmtPub = iso => {
    const p = String(iso||'').split('-').map(Number);
    if(p.length===3) return new Date(Date.UTC(p[0],p[1]-1,p[2])).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'});
    if(p.length===2) return new Date(Date.UTC(p[0],p[1]-1,1)).toLocaleDateString('en-GB',{month:'long',year:'numeric',timeZone:'UTC'});
    return iso||'';
  };
  const storyKey = (ed, i) => ed.date + '_' + (i+1);
  const findEd = date => editions.find(e => e.date === date) || null;
  const current = () => state.ed ? findEd(state.ed) : editions[0];
  const readMins = s => Math.max(1, Math.round(([...(s.body||[]), s.counterpoint||'', s.why||''].join(' ').split(/\s+/).length)/220));

  function markRead(k){ if(!readSet.has(k)){ readSet.add(k); store.set(READ_KEY, [...readSet].slice(-400)); } }

  function setNav(){
    document.querySelectorAll('.nav button').forEach(b => {
      const on = b.dataset.view === (state.view === 'story' ? 'today' : state.view);
      b.setAttribute('aria-current', on ? 'page' : 'false');
    });
  }
  function setHash(h){ try{ history.replaceState(null,'', h ? '#'+h : location.pathname); }catch(e){} }

  function render(){
    setNav();
    if(state.view==='archive') return renderArchive();
    if(state.view==='about') return renderAbout();
    const ed = current();
    if(!ed){
      app.innerHTML = '<div class="empty">' + (dbStatus==='loading' ? 'Loading this week\'s edition…' : 'No edition yet. The next one arrives Monday or Thursday at 06:00 WIB.') + '</div>';
      return;
    }
    if(state.view==='story' && state.story!=null) return renderStory(ed, state.story);
    renderEdition(ed);
  }

  function masthead(ed){
    const isLatest = editions[0] && ed.date === editions[0].date;
    return '<header class="mast">' +
      '<div class="mast-top"><span>Newsroom · No. ' + esc(String(ed.number).padStart(3,'0')) + '</span><span>' + (isLatest ? 'Latest edition' : 'From the archive') + '</span></div>' +
      '<h1 class="brand">Slow Five</h1>' +
      '<div class="dateline"><span>' + esc(fmtDate(ed.date)) + '</span><span>Five stories · ' + ed.stories.reduce((a,s)=>a+readMins(s),0) + ' min</span></div>' +
      '</header>';
  }

  function renderEdition(ed){
    setHash(ed.date === (editions[0]||{}).date ? '' : 'e' + ed.date);
    const items = ed.stories.map((s,i) => {
      const k = storyKey(ed,i), isRead = readSet.has(k);
      return '<li class="item' + (isRead?' is-read':'') + '"><button data-open="' + i + '">' +
        '<span class="num">' + (i+1) + '</span>' +
        '<span class="cat"><span class="tag' + (s.category==='Theology'?' theo':'') + '">' + esc(s.category) + '</span><span>' + esc(s.source.outlet) + ' · ' + readMins(s) + ' min</span>' + (isRead ? '<span class="read-mark">✓ Read</span>' : '') + '</span>' +
        '<h3>' + esc(s.headline) + '</h3>' +
        '<p class="dek">' + esc(s.dek) + '</p>' +
      '</button></li>';
    }).join('');
    app.innerHTML = masthead(ed) +
      '<p class="intro">' + esc(ed.intro) + '</p>' +
      '<ol class="list">' + items + '</ol>' +
      (dbStatus==='offline' ? '<p class="note">Offline: showing your saved copy. New editions appear when you reconnect.</p>' : '');
    app.querySelectorAll('[data-open]').forEach(b => b.addEventListener('click', () => openStory(ed.date, +b.dataset.open)));
    window.scrollTo(0,0);
  }

  function openStory(date, i){ state = {view:'story', ed:date, story:i}; render(); }

  function renderStory(ed, i){
    const s = ed.stories[i]; if(!s){ state.view='today'; return render(); }
    markRead(storyKey(ed,i));
    setHash('e' + ed.date + '_' + (i+1));
    const src = s.source || {};
    app.innerHTML =
      '<button class="back" id="back-btn">← No. ' + esc(String(ed.number).padStart(3,'0')) + ' · ' + esc(fmtDate(ed.date)) + '</button>' +
      '<article>' +
        '<header class="art-head">' +
          '<div class="cat"><span class="tag' + (s.category==='Theology'?' theo':'') + '">' + esc(s.category) + '</span><span>' + (i+1) + ' of ' + ed.stories.length + ' · ' + esc(s.kicker||'') + '</span></div>' +
          '<h1>' + esc(s.headline) + '</h1>' +
          '<p class="dek">' + esc(s.dek) + '</p>' +
          '<div class="byline">Digest of ' + esc(src.author||'') + ', <i>' + esc(src.outlet||'') + '</i> · ' + readMins(s) + ' min read</div>' +
        '</header>' +
        '<div class="body">' + (s.body||[]).map(p => '<p>' + esc(p) + '</p>').join('') + '</div>' +
        (s.counterpoint ? '<section class="box"><h4>Strongest counterpoint</h4><p>' + esc(s.counterpoint) + '</p></section>' : '') +
        (s.why ? '<section class="box why"><h4>Why it matters</h4><p>' + esc(s.why) + '</p></section>' : '') +
        '<footer class="src">' +
          '<div class="m">Read the original</div>' +
          '<div class="t">' + esc(src.title||'') + '</div>' +
          '<div class="m">' + esc(src.author||'') + ' · ' + esc(src.outlet||'') + ' · ' + esc(fmtPub(src.published)) + (src.readMins ? ' · ~' + src.readMins + ' min' : '') + '</div>' +
          (src.url ? '<a class="cta" href="' + esc(src.url) + '" target="_blank" rel="noopener">Open at ' + esc(src.outlet||'source') + ' ↗</a>' : '') +
        '</footer>' +
      '</article>' +
      '<div class="pager">' +
        '<button id="prev-btn"' + (i===0?' disabled':'') + '>← Previous</button>' +
        '<button id="next-btn">' + (i===ed.stories.length-1 ? 'Back to edition' : 'Next story →') + '</button>' +
      '</div>';
    document.getElementById('back-btn').onclick = () => { state = {view:'today', ed:ed.date, story:null}; render(); };
    document.getElementById('prev-btn').onclick = () => { if(i>0) openStory(ed.date, i-1); };
    document.getElementById('next-btn').onclick = () => { if(i < ed.stories.length-1) openStory(ed.date, i+1); else { state={view:'today', ed:ed.date, story:null}; render(); } };
    window.scrollTo(0,0);
  }

  function renderArchive(){
    setHash('archive');
    const rows = editions.map(e => {
      const done = e.stories.filter((_,i)=>readSet.has(storyKey(e,i))).length;
      return '<li><button data-ed="' + esc(e.date) + '">' +
        '<span class="d">No. ' + String(e.number).padStart(3,'0') + ' · ' + esc(fmtDate(e.date)) + ' · ' + done + '/' + e.stories.length + ' read</span>' +
        '<span class="h">' + esc(e.stories.map(s=>s.headline).slice(0,2).join(' · ')) + '</span>' +
      '</button></li>';
    }).join('');
    app.innerHTML = '<h2 class="sec-title">Archive</h2><p class="meta-line">' + editions.length + ' edition' + (editions.length===1?'':'s') + ' · newest first</p>' +
      (rows ? '<ul class="arch">' + rows + '</ul>' : '<div class="empty">No editions yet.</div>');
    app.querySelectorAll('[data-ed]').forEach(b => b.addEventListener('click', () => { state={view:'today', ed:b.dataset.ed, story:null}; render(); }));
    window.scrollTo(0,0);
  }

  function renderAbout(){
    setHash('about');
    const sizes = [16,18,20,22];
    app.innerHTML = '<div class="about">' +
      '<h2 class="sec-title">About Newsroom Slow Five</h2>' +
      '<p>Five long reads, digested, twice a week. Each story is a ~400-word synthesis of one serious piece: the argument, its strongest counterpoint, and why it matters. Then a link to the original, if you want the full meal.</p>' +
      '<h3>Schedule</h3><p>New editions every Monday and Thursday at 06:00 Jakarta time.</p>' +
      '<h3>Editorial mix</h3>' +
      '<table class="mix"><tbody>' +
        '<tr><td>Core sources: Works in Progress, Palladium, Quanta, Noema</td><td>80% · 4 of 5 each edition</td></tr>' +
        '<tr><td>Theology: doctrinal discourse or a recent journal paper</td><td>10% · 1 story in alternate editions</td></tr>' +
        '<tr><td>Other rigorous long-form or primary research</td><td>10% · 1 story in the other editions</td></tr>' +
      '</tbody></table>' +
      '<p style="margin-top:12px">Across AI, economics, science, business, politics and opinion. Pieces qualify only if they carry original reporting, data or a sustained argument. No news pegs, launches or listicles.</p>' +
      '<h3>Sources beyond the core</h3>' +
      '<ul class="srcs"><li>Long-form: Aeon, Asterisk, Asimov Press, Lawfare, Nature and Science features, FT Big Read</li><li>Primary research: arXiv, NBER, SSRN papers and lab research posts</li><li>Theology: Themelios, JETS, First Things, Mere Orthodoxy, Christianity Today, TGC essays, new monographs</li></ul>' +
      '<h3>Text size</h3>' +
      '<div class="settings">' + sizes.map(z => '<button id="size-' + z + '" data-size="' + z + '" aria-pressed="' + (prefs.size===z) + '">' + (z===16?'Small':z===18?'Default':z===20?'Large':'X-Large') + '</button>').join('') + '</div>' +
      '<p class="note">Built for e-ink: no animation, high contrast, large tap targets. Your read marks and text size stay on this device. Add to Home Screen to install.</p>' +
      '</div>';
    app.querySelectorAll('[data-size]').forEach(b => b.addEventListener('click', () => {
      prefs.size = +b.dataset.size; store.set(PREF_KEY, prefs);
      document.documentElement.style.setProperty('--fs', prefs.size + 'px'); renderAbout();
    }));
    window.scrollTo(0,0);
  }

  document.querySelectorAll('.nav button').forEach(b => b.addEventListener('click', () => {
    const v = b.dataset.view;
    state = v==='today' ? {view:'today', ed:null, story:null} : {view:v, ed:null, story:null};
    render();
  }));

  // Deep links: #archive, #about, #e2026-09-28, #e2026-09-28_3
  function applyHash(){
    const h = (location.hash||'').slice(1);
    if(h==='archive' || h==='about'){ state = {view:h, ed:null, story:null}; return; }
    const m = h.match(/^e(\d{4}-\d{2}-\d{2})(?:_(\d))?$/);
    if(m){ state = m[2] ? {view:'story', ed:m[1], story:+m[2]-1} : {view:'today', ed:m[1], story:null}; }
  }
  applyHash();
  render();

  function valid(e){ return e && typeof e.date==='string' && Array.isArray(e.stories) && e.stories.length; }

  (async function load(){
    const bust = '?t=' + Date.now();
    try{
      const idx = await (await fetch('editions/index.json' + bust, {cache:'no-store'})).json();
      const dates = (idx.editions||[]).map(e=>e.date).sort().reverse().slice(0,60);
      const list = (await Promise.all(dates.map(d => fetch('editions/' + d + '.json').then(r => r.ok ? r.json() : null).catch(()=>null)))).filter(valid);
      list.sort((a,b)=> a.date < b.date ? 1 : -1);
      const changed = JSON.stringify(list) !== JSON.stringify(editions);
      editions = list; store.set(CACHE_KEY, list.slice(0,40)); dbStatus = 'live';
      if(state.ed && !findEd(state.ed)) state = {view:'today', ed:null, story:null};
      render();
    }catch(e){ dbStatus = 'offline'; render(); }
  })();
})();
</script>
<script>
if('serviceWorker' in navigator){ window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{})); }
</script>
